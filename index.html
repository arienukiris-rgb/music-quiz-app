<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽クイズ</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- ジャンル選択画面 -->
  <section id="screen-genre" class="screen">
    <h1>🎵 音楽クイズ</h1>
    <p class="subtitle">ジャンルを選んでスタート！</p>
    <div id="genre-list" class="genre-list">
      <!-- ここにジャンルボタンがJSで生成される -->
    </div>

    <!-- Google AdSense 広告ユニット -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1504397134995962"
     crossorigin="anonymous"></script>
    <!-- スクエア -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-1504397134995962"
         data-ad-slot="8628745694"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <a href="privacy.html" class="footer-link">プライバシーポリシー</a>
  </section>

  <!-- クイズ画面 -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <span id="quiz-genre-name" class="genre-badge"></span>
      <span id="quiz-progress" class="progress"></span>
      <span id="quiz-score" class="score"></span>
    </div>
    <div class="question-box">
      <p id="question-text" class="question-text"></p>
    </div>
    <div id="choice-list" class="choice-list">
      <!-- ここに選択肢ボタンがJSで生成される -->
    </div>
    <div id="feedback" class="feedback hidden"></div>
    <button id="btn-next" class="btn-next hidden">次の問題へ →</button>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen hidden">
    <h2>結果発表</h2>
    <p id="result-score" class="result-score"></p>
    <p id="result-message" class="result-message"></p>
    <div class="share-buttons">
      <a id="share-x" class="share-btn share-x" target="_blank" rel="noopener">𝕏で共有</a>
      <a id="share-line" class="share-btn share-line" target="_blank" rel="noopener">LINEで共有</a>
    </div>
    <div class="result-buttons">
      <button id="btn-retry">同じジャンルでもう一度</button>
      <button id="btn-back-genre">ジャンル選択に戻る</button>
    </div>
  </section>

  <script src="questions.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
